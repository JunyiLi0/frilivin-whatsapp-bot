name: frilivin-whatsapp-bot

# Rotation des logs : sur un petit VPS, le disque est la ressource qui manque
# en premier. Sans cette limite, un conteneur bavard peut remplir le volume
# racine en quelques semaines.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Le volume média est partagé par des services qui tournent sous des UID
  # différents (bridge : 1000 « node », api/worker : 10001 « bot »). Docker crée
  # le point de montage en root:root, donc aucun des deux ne peut y créer ses
  # sous-dossiers : le bridge échouait sur `mkdir /media/in` (EACCES) et
  # signalait une pièce jointe non téléchargeable. Ce conteneur prépare les deux
  # répertoires puis sort ; il est le seul à avoir besoin de root.
  media-init:
    image: busybox:1.37
    user: root
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /media/in /media/out
        # Écriture réservée au service qui produit, lecture ouverte à l'autre :
        # le bridge dépose les entrants, le worker écrit les fichiers générés.
        chown 1000:1000 /media/in
        chown 10001:10001 /media/out
        chmod 0755 /media/in /media/out
    volumes:
      - media_data:/media
    restart: "no"
    logging: *default-logging
    mem_limit: 64m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *default-logging
    mem_limit: 320m

  api:
    build:
      context: ./app
    restart: unless-stopped
    init: true
    command:
      - uvicorn
      - whatsapp_bot.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --no-access-log
    env_file:
      - .env
    environment:
      SERVICE_NAME: api
    volumes:
      - sqlite_data:/data
      - media_data:/media
      - ./sage-data:/data/sage:ro
    ports:
      # Bind explicite sur la boucle locale : rien n'est joignable depuis
      # l'extérieur de la machine. Pour un accès distant, passer par SSH.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3).status == 200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    mem_limit: 512m

  worker:
    build:
      context: ./app
    restart: unless-stopped
    init: true
    command: ["python", "-m", "whatsapp_bot.worker.main"]
    env_file:
      - .env
    environment:
      SERVICE_NAME: worker
    volumes:
      - sqlite_data:/data
      - media_data:/media
      # Exports Sage (clients/articles) fournis par l'exploitant, jamais versionnés.
      - ./sage-data:/data/sage:ro
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    logging: *default-logging
    mem_limit: 512m

  bridge:
    build:
      context: ./bridge
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      SERVICE_NAME: bridge
    volumes:
      - wa_session:/data
      - media_data:/media
    ports:
      - "127.0.0.1:${BRIDGE_PORT:-3000}:3000"
    depends_on:
      # On attend que l'API soit prête : sinon les tout premiers messages
      # reçus après le scan du QR partiraient dans le vide.
      api:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          fetch("http://127.0.0.1:3000/health")
            .then((r) => process.exit(r.ok ? 0 : 1))
            .catch(() => process.exit(1));
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    mem_limit: 768m

volumes:
  # Session WhatsApp multi-device + file d'envoi. À sauvegarder :
  # sa perte impose un nouveau scan du QR code.
  wa_session:
  # Base SQLite, partagée entre l'api (écriture des entrants) et le worker.
  sqlite_data:
  # Pièces jointes : /media/in écrit par le bridge, /media/out par le worker.
  # Les deux répertoires et leurs propriétaires sont posés par `media-init`.
  media_data:
  redis_data:
